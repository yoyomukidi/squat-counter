<!<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-based Squat Counter Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-xl font-bold mb-4">AI Squat Challenge 🤖</h1>

    <!-- TAHAP 1: INPUT NAMA & CEK REKOR -->
    <div id="login-section" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <label class="block text-xs font-bold text-slate-300 mb-2">MASUKKAN NAMA PESERTA</label>
        <input type="text" id="username" placeholder="Contoh: Budi Santoso" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 mb-4">
        <button id="check-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow transition text-sm">
            Mulai / Cek Rekor
        </button>
    </div>

    <!-- TAHAP 2: POPUP INFORMASI REKOR -->
    <div id="info-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 text-center shadow-2xl">
            <h3 class="text-lg font-bold text-emerald-400 mb-1" id="modal-name">Halo!</h3>
            <p class="text-xs text-slate-400 mb-6">Berikut ringkasan squat Anda:</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700/50">
                    <p class="text-[10px] text-slate-400">Hari Ini</p>
                    <p class="text-2xl font-black text-emerald-400" id="modal-today">0</p>
                </div>
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700/50">
                    <p class="text-[10px] text-slate-400">Total Keseluruhan</p>
                    <p class="text-2xl font-black text-blue-400" id="modal-total">0</p>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="close-modal-btn" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-sm">Tutup</button>
                <button id="start-challenge-btn" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm">Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- TAHAP 3: AREA KAMERA & SQUAT COUNTER -->
    <div id="app-section" class="hidden flex flex-col items-center w-full max-w-md">
        <div class="w-full mb-2 text-xs text-slate-400 flex justify-between items-center bg-slate-800 px-3 py-2 rounded-lg">
            <span>Peserta: <strong id="active-user-display" class="text-white"></strong></span>
            <button id="change-user-btn" class="text-blue-400 underline text-[11px]">Ganti Nama</button>
        </div>

        <div class="relative w-full bg-black rounded-xl overflow-hidden shadow-2xl flex justify-center items-center aspect-[3/4]">
            <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
            <canvas id="output_canvas" class="absolute inset-0 z-10 w-full h-full -scale-x-100"></canvas>
            
            <div class="absolute top-3 left-3 z-20 bg-slate-800/90 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-700">
                <p class="text-[10px] text-slate-400">STATUS</p>
                <p id="pose-status" class="text-xs font-bold text-yellow-400">Memuat AI...</p>
            </div>

            <div class="absolute top-3 right-3 z-20 bg-slate-800/90 backdrop-blur px-4 py-2 rounded-lg border border-slate-700 text-center shadow-lg">
                <p class="text-xs text-slate-300 font-semibold tracking-wider">REPS</p>
                <p id="counter" class="text-5xl font-black text-emerald-400 leading-none mt-1">0</p>
            </div>
        </div>

        <div class="mt-4 w-full">
            <button id="save-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition text-sm">
                Simpan Squat
            </button>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxI_GKCVtC6gncyCXfXMNyswEtC5uDu6Z_hUgC1FpFcegBmA7pUkUB4BguUVL20AJ2r/exec';

        const loginSection = document.getElementById('login-section');
        const infoModal = document.getElementById('info-modal');
        const appSection = document.getElementById('app-section');
        
        const userInput = document.getElementById('username');
        const checkBtn = document.getElementById('check-btn');
        const modalName = document.getElementById('modal-name');
        const modalToday = document.getElementById('modal-today');
        const modalTotal = document.getElementById('modal-total');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const startChallengeBtn = document.getElementById('start-challenge-btn');
        const activeUserDisplay = document.getElementById('active-user-display');
        const changeUserBtn = document.getElementById('change-user-btn');

        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const counterElement = document.getElementById('counter');
        const statusElement = document.getElementById('pose-status');
        const saveButton = document.getElementById('save-btn');

        let squatCount = 0;
        let stage = null;
        let currentUserName = "";
        let cameraInstance = null;

        // Dioptimalkan agar langsung membuka popup secara instan tanpa menunggu jaringan Google Sheets
        checkBtn.addEventListener('click', () => {
            const name = userInput.value.trim();
            if (!name) {
                alert("Silakan masukkan nama Anda terlebih dahulu!");
                userInput.focus();
                return;
            }
            currentUserName = name;

            // Tampilkan modal secara instan
            modalName.innerText = `Halo, ${name}!`;
            modalToday.innerText = "0";
            modalTotal.innerText = "0";
            infoModal.classList.remove('hidden');

            // Ambil data rekor di latar belakang (background fetch) agar terasa sangat cepat
            fetch(`${APPS_SCRIPT_URL}?action=checkUser&nama=${encodeURIComponent(name)}`)
                .then(res => res.json())
                .then(data => {
                    modalToday.innerText = data.todayReps || 0;
                    modalTotal.innerText = data.totalReps || 0;
                })
                .catch(err => {
                    console.log("Gagal memuat rekor online, menggunakan nilai default:", err);
                });
        });

        closeModalBtn.addEventListener('click', () => {
            infoModal.classList.add('hidden');
            userInput.value = "";
            try {
                window.close();
            } catch (e) {
                console.log("Penutupan tab diblokir oleh browser.");
            }
            window.location.href = "about:blank";
        });

        startChallengeBtn.addEventListener('click', () => {
            infoModal.classList.add('hidden');
            loginSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            activeUserDisplay.innerText = currentUserName;
            
            if (!cameraInstance) {
                initPoseAndCamera();
            }
        });

        changeUserBtn.addEventListener('click', () => {
            appSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
            userInput.value = "";
            squatCount = 0;
            counterElement.innerText = 0;
        });

        function calculateAngle(a, b, c) {
            let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) angle = 360.0 - angle;
            return angle;
        }

        // Logika diperketat agar tidak sensitif terhadap gerakan tangan/kepala/badan
        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;
                
                // Ambil titik kaki kiri dan kanan untuk kalkulasi yang lebih stabil
                const leftHip = landmarks[23];
                const leftKnee = landmarks[25];
                const leftAnkle = landmarks[27];
                
                const rightHip = landmarks[24];
                const rightKnee = landmarks[26];
                const rightAnkle = landmarks[28];

                // Pilih sisi yang visibilitasnya lebih baik
                let hip, knee, ankle;
                if ((leftHip && leftHip.visibility > 0.5) && (rightHip && rightHip.visibility > 0.5)) {
                    // Ambil rata-rata atau pilih salah satu sisi yang dominan
                    hip = leftHip.y < rightHip.y ? leftHip : rightHip; // Ambil yang lebih lengkap
                }
                
                // Menggunakan sisi kiri sebagai prioritas standar, pastikan visibility tinggi (>0.6)
                if (leftHip && leftKnee && leftAnkle && leftHip.visibility > 0.6 && leftKnee.visibility > 0.6 && leftAnkle.visibility > 0.6) {
                    hip = leftHip;
                    knee = leftKnee;
                    ankle = leftAnkle;
                } else if (rightHip && rightKnee && rightAnkle && rightHip.visibility > 0.6 && rightKnee.visibility > 0.6 && rightAnkle.visibility > 0.6) {
                    hip = rightHip;
                    knee = rightKnee;
                    ankle = rightAnkle;
                }

                if (hip && knee && ankle) {
                    let angle = calculateAngle(hip, knee, ankle);

                    // Validasi tambahan: Pastikan posisi pinggul benar-benar di atas lutut secara vertikal (mencegah false trigger dari gerakan tangan/kepala)
                    // Koordinat y MediaPipe semakin ke bawah semakin besar nilainya.
                    let isBodyUpright = hip.y < knee.y; 

                    if (angle > 150 && isBodyUpright) {
                        stage = "up";
                        statusElement.innerText = "Berdiri (Up)";
                        statusElement.className = "text-xs font-bold text-emerald-400";
                    } else if (angle < 95 && stage === "up") {
                        stage = "down";
                        statusElement.innerText = "Jongkok (Down)";
                        statusElement.className = "text-xs font-bold text-blue-400";
                        squatCount++;
                        counterElement.innerText = squatCount;
                    } else if (angle >= 95 && angle <= 150) {
                        if (stage === "down") {
                            statusElement.innerText = "Naik / Turun...";
                            statusElement.className = "text-xs font-bold text-yellow-400";
                        }
                    }
                } else {
                    statusElement.innerText = "Mundurkan Posisi Badan";
                    statusElement.className = "text-xs font-bold text-red-400";
                }
                drawCustomSkeleton(landmarks);
            } else {
                statusElement.innerText = "Badan Tidak Terlihat";
                statusElement.className = "text-xs font-bold text-red-400";
            }
            canvasCtx.restore();
        }

        function drawCustomSkeleton(landmarks) {
            const connections = [[11, 12], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
            canvasCtx.strokeStyle = '#10B981';
            canvasCtx.lineWidth = 3;

            connections.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                if (p1 && p2 && p1.visibility > 0.4 && p2.visibility > 0.4) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
                    canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
                    canvasCtx.stroke();
                }
            });

            canvasCtx.fillStyle = '#EF4444';
            landmarks.forEach((landmark) => {
                if (landmark.visibility > 0.4) {
                    canvasCtx.beginPath();
                    canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 4, 0, 2 * Math.PI);
                    canvasCtx.fill();
                }
            });
        }

        function initPoseAndCamera() {
            const pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 0,
                smoothLandmarks: true,
                enableSegmentation: false,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            pose.onResults(onResults);

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640, max: 1280 },
                        height: { ideal: 480, max: 720 }
                    }
                })
                .then((stream) => {
                    videoElement.srcObject = stream;
                    videoElement.play();

                    async function sendVideoFrame() {
                        if (videoElement.readyState >= 2) {
                            await pose.send({ image: videoElement });
                        }
                        requestAnimationFrame(sendVideoFrame);
                    }
                    sendVideoFrame();
                })
                .catch((err) => {
                    console.error("Gagal mengakses kamera: ", err);
                    alert("Tidak dapat mengakses kamera. Pastikan izin kamera telah diberikan.");
                });
            }
        }

        saveButton.addEventListener('click', async () => {
            if (squatCount === 0) {
                alert("Belum ada squat yang dihitung!");
                return;
            }

            saveButton.innerText = "Menyimpan...";
            saveButton.disabled = true;

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama: currentUserName, reps: squatCount })
                });
                
                alert(`Berhasil menyimpan ${squatCount} repetisi untuk ${currentUserName}!`);
                
                try {
                    window.close();
                } catch (e) {
                    console.log("Penutupan tab diblokir oleh browser.");
                }
                window.location.href = "about:blank";

            } catch (error) {
                console.error("Gagal menyimpan:", error);
                alert("Terjadi kesalahan saat menyimpan data.");
                saveButton.innerText = "Simpan ke Google Sheets";
                saveButton.disabled = false;
            }
        });
    </script>
</body>
</html>
